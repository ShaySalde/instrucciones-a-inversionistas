name: Build Windows Installer

# Genera el instalador .exe de Windows en una máquina Windows real.
# Se ejecuta al hacer push a main, o manualmente desde la pestaña "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesita escribir en el repo para publicar la Release con el .exe.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      # Artifact versionado: historial de cada build (caduca a los ~90 días).
      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Instrucciones-a-Inversionistas-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      # Copia el .exe a un nombre estable (sin versión) para tener un link fijo.
      - name: Copiar a nombre estable
        shell: bash
        run: |
          exe=$(ls dist/*.exe | head -1)
          cp "$exe" "dist/Instrucciones-a-Inversionistas-Setup.exe"
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Release "latest" rolling: siempre la misma URL de descarga.
      - name: Publicar Release (latest)
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: latest
          name: Última versión (Windows)
          body: |
            Instalador de Windows siempre actualizado al último push a `main`.

            **Versión del paquete:** ${{ env.APP_VERSION }}
            **Commit:** ${{ github.sha }}

            Descarga directa (link fijo):
            https://github.com/${{ github.repository }}/releases/latest/download/Instrucciones-a-Inversionistas-Setup.exe
          make_latest: true
          files: dist/Instrucciones-a-Inversionistas-Setup.exe
