name: Build Installers (Windows + macOS)

# Genera los instaladores de Windows (.exe) y macOS (.dmg) en máquinas reales.
# Se ejecuta al hacer push a main, o manualmente desde la pestaña "Actions".
# (El archivo conserva el nombre build-windows.yml para no romper enlaces/curl existentes.)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesita escribir en el repo para publicar la Release con los instaladores.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # si una plataforma falla, la otra igual se publica
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (.exe)
        if: matrix.platform == 'win'
        run: npm run dist

      # macOS universal (Intel + Apple Silicon). Sin firma de Apple (no hay certificado):
      # CSC_IDENTITY_AUTO_DISCOVERY=false evita que electron-builder intente firmar.
      - name: Build macOS installer (.dmg, universal, sin firma)
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --universal --publish never

      # Copia a un nombre estable (sin versión) para tener un link de descarga fijo.
      - name: Copiar a nombre estable
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.platform }}" = "win" ]; then
            cp "$(ls dist/*.exe | head -1)" "out/Instrucciones-a-Inversionistas-Setup.exe"
          else
            cp "$(ls dist/*.dmg | head -1)" "out/Instrucciones-a-Inversionistas-mac.dmg"
          fi

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  # Un solo job publica la Release "latest" con lo que haya compilado (evita carreras).
  release:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer versión del paquete
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts

      - name: Publicar Release (latest)
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: latest
          name: Última versión (Windows + macOS)
          body: |
            Instaladores siempre actualizados al último push a `main`.

            **Versión del paquete:** ${{ steps.ver.outputs.v }}
            **Commit:** ${{ github.sha }}

            Descargas directas (links fijos):
            - **Windows:** https://github.com/${{ github.repository }}/releases/latest/download/Instrucciones-a-Inversionistas-Setup.exe
            - **macOS** (universal, sin firma): https://github.com/${{ github.repository }}/releases/latest/download/Instrucciones-a-Inversionistas-mac.dmg
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
